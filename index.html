<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111"><meta name="description" content="The Last Station. A personal archive of my novels and stories.">
<title>Last Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111;--surface:#171717;--text:#e9e7e2;--muted:#93918b;--dim:#66645f;--line:#30302d;--accent:#c5c0b4;--serif:"Literata",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 var(--sans);min-height:100vh}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{color:inherit}.wrap{width:min(900px,calc(100% - 40px));margin:0 auto}.header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font:500 18px var(--serif);letter-spacing:-.03em}.nav{display:flex;gap:24px;color:var(--muted);font-size:12px}.nav a:hover,.text-link:hover{color:var(--text)}.page{padding:60px 0 90px}.kicker{font:10px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:400 clamp(42px,7vw,66px)/1.1 var(--serif);letter-spacing:-.055em;margin:16px 0 15px}h2{font:400 28px/1.3 var(--serif);letter-spacing:-.035em;margin-bottom:8px}.intro{color:var(--muted);max-width:480px;margin-bottom:40px}.search{width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--text);outline:none;font-size:13px;margin-bottom:34px}.search:focus{border-color:#888}.search::placeholder{color:var(--dim)}.section-label{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:0;color:var(--muted);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.series-list{display:flex;flex-direction:column}.series{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);transition:padding .18s;cursor:pointer}.series:hover{padding-left:6px;padding-right:6px}.series-number{color:var(--dim);font:11px var(--mono)}.series-title{font:400 21px/1.35 var(--serif);margin:0 0 5px}.series-sub{color:var(--muted);font-size:12px}.series-meta{text-align:right;color:var(--muted);font:10px/1.8 var(--mono)}.arrow{font-size:17px;color:var(--dim);margin-left:12px}.series:hover .arrow{color:var(--text)}.empty{padding:28px 0;color:var(--muted)}.foot{border-top:1px solid var(--line);padding:20px 0 28px;display:flex;justify-content:space-between;color:var(--dim);font:10px var(--mono);letter-spacing:.03em}
.breadcrumb{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:40px}.breadcrumb a:hover{color:var(--text)}.detail-head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:30px}.detail-head h1{font-size:clamp(38px,6vw,56px);max-width:680px}.detail-description{color:var(--muted);max-width:590px;margin:18px 0 20px}.detail-tags{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em}.chapter-heading{font:10px var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:8px}.chapter-list{border-top:1px solid var(--line)}.chapter{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}.chapter:hover .chapter-name{color:#fff}.chapter-name{font-size:13px}.chapter-sub{color:var(--dim);font:10px var(--mono)}.chapter-arrow{color:var(--dim)}
.reader-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.reader-title{font:400 clamp(32px,5vw,46px)/1.25 var(--serif);letter-spacing:-.035em;margin:42px 0 8px}.reader-chapter{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:42px}.prose{max-width:650px;margin:0 auto;font:400 17px/2 var(--serif);color:#d9d6cf;white-space:pre-line}.prose p{margin-bottom:1.6em}.placeholder{border-left:2px solid #5b5a54;padding:12px 18px;margin:30px 0;color:var(--muted);font:12px/1.8 var(--sans)}.reader-controls{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:60px;padding-top:20px}.reader-btn{background:transparent;border:1px solid var(--line);padding:10px 14px;font-size:12px;cursor:pointer}.reader-btn:hover:not(:disabled){border-color:#777}.reader-btn:disabled{opacity:.3;cursor:not-allowed}.reader-end{text-align:center;margin:38px 0;color:var(--dim);font:10px var(--mono);letter-spacing:.12em}
@media(max-width:600px){.wrap{width:calc(100% - 32px)}.page{padding:42px 0 65px}.header{height:66px}.nav{gap:15px}.series{grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:19px 0}.series-title{font-size:18px}.series-meta{font-size:9px}.intro{margin-bottom:30px}.reader-top{align-items:flex-start}.prose{font-size:16px;line-height:1.95}.foot{gap:15px;flex-direction:column}.detail-head{margin-bottom:25px}.reader-title{margin-top:32px}.reader-chapter{margin-bottom:30px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><a href="#/" class="logo">Last Station</a><nav class="nav"><a href="#/">Works</a><a href="#/about">About</a></nav></header>
<main id="app" class="page" aria-live="polite"></main>
<footer class="foot"><span>LAST STATION © <span id="year"></span></span><span>For the stories still on their way.</span></footer>
</div>
<script src="./works.js"></script>
<script>
(() => {
const config = window.LAST_STATION || {siteTitle:'Last Station',message:'A place for stories still on their way.',works:[]};
const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route = () => decodeURIComponent(location.hash.slice(1) || '/');
const allWorks = config.works || [];
function crumb(label){return '<div class="breadcrumb"><a href="#/">Works</a><span>/</span><span>'+esc(label)+'</span></div>'}
function renderHome(){
 document.title='Last Station';
 app.innerHTML='<div class="kicker">A personal archive</div><h1>Last Station</h1><p class="intro">'+esc(config.message || 'Stories, notes, and things still being written.')+'</p><input class="search" id="search" type="search" placeholder="Search stories…" aria-label="Search stories"><div class="section-label"><span>Collected works</span><span id="count"></span></div><div class="series-list" id="series-list"></div>';
 const search=document.getElementById('search'),list=document.getElementById('series-list'),count=document.getElementById('count');
 function paint(){const q=search.value.trim().toLowerCase();const filtered=allWorks.filter(w=>[w.title,w.type,w.description].some(v=>String(v||'').toLowerCase().includes(q)));count.textContent=String(filtered.length).padStart(2,'0');list.innerHTML=filtered.length?filtered.map((w,i)=>'<a class="series" href="#/novel/'+encodeURIComponent(w.id)+'"><span class="series-number">'+String(i+1).padStart(2,'0')+'</span><span><h2 class="series-title">'+esc(w.title)+'</h2><span class="series-sub">'+esc(w.type||'Novel')+' · '+esc(w.description||'')+'</span></span><span class="series-meta">'+esc(w.status||'In progress')+'<span class="arrow"> ↗</span></span></a>').join(''):'<div class="empty">No stories found.</div>'}
 search.addEventListener('input',paint);paint();
}
function renderNovel(id){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 document.title=w.title+' — Last Station';
 const chapters=w.chapters||[];
 app.innerHTML=crumb(w.title)+'<section class="detail-head"><div class="kicker">'+esc(w.type||'Novel')+'</div><h1>'+esc(w.title)+'</h1><p class="detail-description">'+esc(w.longDescription||w.description||'')+'</p><div class="detail-tags"><span>'+esc(w.status||'In progress')+'</span><span>'+chapters.length+' chapters planned</span></div></section><div class="chapter-heading">Chapters <span style="float:right">'+String(chapters.length).padStart(2,'0')+'</span></div><div class="chapter-list">'+(chapters.length?chapters.map((c,i)=>'<a class="chapter" href="#/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(c.id)+'"><span><span class="chapter-name">'+esc(c.title)+'</span><br><span class="chapter-sub">'+esc(c.status||'Not yet published')+'</span></span><span class="chapter-arrow">↗</span></a>').join(''):'<p class="empty">Chapters will appear here.</p>')+'</div>';
}
function renderReader(id,chapterId){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 const chapters=w.chapters||[];let index=chapters.findIndex(c=>c.id===chapterId);if(index<0)index=0;
 const c=chapters[index];if(!c){renderNovel(id);return}
 document.title=c.title+' — '+w.title;
 const content=c.content||'This chapter is a placeholder. Replace this text with your manuscript when it is ready.';
 app.innerHTML='<div class="reader-top"><a href="#/novel/'+encodeURIComponent(w.id)+'">← '+esc(w.title)+'</a><span>'+String(index+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0')+'</span></div><article><h1 class="reader-title">'+esc(c.title)+'</h1><div class="reader-chapter">'+esc(w.type||'Novel')+' · '+esc(c.status||'Placeholder chapter')+'</div><div class="prose">'+content.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+(c.placeholder?'<div class="placeholder">PLACEHOLDER TEXT · Replace the chapter content in <code>works.js</code>. The reading layout and chapter navigation are already wired up.</div>':'')+'<div class="reader-end">— END OF CHAPTER —</div></article><div class="reader-controls"><button class="reader-btn" id="prev" '+(index===0?'disabled':'')+'>← Previous</button><a class="reader-btn" href="#/novel/'+encodeURIComponent(w.id)+'">Chapter list</a><button class="reader-btn" id="next" '+(index===chapters.length-1?'disabled':'')+'>Next →</button></div>';
 const prev=document.getElementById('prev'),next=document.getElementById('next');
 if(index>0)prev.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index-1].id));
 if(index<chapters.length-1)next.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index+1].id));
}
function renderAbout(){document.title='About — Last Station';app.innerHTML=crumb('About')+'<div class="kicker">A note from the author</div><h1>Still in transit.</h1><p class="intro">'+esc(config.about||'This is a home for the stories I am working on, the ones that are finished, and the ones that are not ready to leave the notebook yet.')+'</p><p><a class="text-link" href="#/">← Back to the library</a></p>'}
function render(){const parts=route().split('/').filter(Boolean);if(parts[0]==='novel'&&parts[1])renderNovel(parts[1]);else if(parts[0]==='read'&&parts[1])renderReader(parts[1],parts[2]);else if(parts[0]==='about')renderAbout();else renderHome();window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
})();
</script>
</body>
</html>
