<script>
(() => {
const config = window.LAST_STATION || {siteTitle:'Last Station',message:'A place for stories still on their way.',works:[]};
const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatChapterTitle = title => String(title || '').replace(/\bchapter\s*(\d+)/i, 'Chapter $1').replace(/\s*[·•]\s*/, ' - ');
const route = () => decodeURIComponent(location.hash.slice(1) || '/');
const preferenceDefaults={theme:"dark",font:"literata",fontSize:17,lineHeight:2};
function loadPreferences(){try{return {...preferenceDefaults,...JSON.parse(localStorage.getItem("last-station-reading-settings")||"{}")}}catch{return {...preferenceDefaults}}}
let preferences=loadPreferences();
let settingsReturnRoute = '/';
let settingsReturnScroll = 0;
let settingsReturnPending = false;
try {
 const savedReturn = JSON.parse(sessionStorage.getItem('last-station-settings-return') || 'null');
 if(savedReturn && typeof savedReturn.route === 'string' && savedReturn.route !== '/settings'){
  settingsReturnRoute = savedReturn.route;
  settingsReturnScroll = Number(savedReturn.scroll) || 0;
 }
} catch {}
const fontChoices={literata:{label:"Literata · literary serif",value:'"Literata", Georgia, serif'},lora:{label:"Lora · classic book serif",value:'"Lora", Georgia, serif'},source:{label:"Source Serif 4 · balanced serif",value:'"Source Serif 4", Georgia, serif'},ibm:{label:"IBM Plex Serif · modern serif",value:'"IBM Plex Serif", Georgia, serif'},merriweather:{label:"Merriweather · clear serif",value:'"Merriweather", Georgia, serif'},sans:{label:"DM Sans · clean sans-serif",value:'"DM Sans", Arial, sans-serif'},georgia:{label:"Georgia · system serif",value:"Georgia, serif"},system:{label:"System default",value:"system-ui, sans-serif"}};
function applyPreferences(){
 const selectedFont=fontChoices[preferences.font]||fontChoices.literata;
 document.body.dataset.theme=preferences.theme;
 document.documentElement.style.setProperty("--reading-font",selectedFont.value);
 document.documentElement.style.setProperty("--reading-size",String(preferences.fontSize)+"px");
 document.documentElement.style.setProperty("--reading-line-height",String(preferences.lineHeight));
 document.querySelectorAll(".prose,.prose p,.font-preview").forEach(node=>node.style.setProperty("font-family",selectedFont.value,"important"));
 try{localStorage.setItem("last-station-reading-settings",JSON.stringify(preferences))}catch{}
}
let allWorks = config.works || [];
const supabaseClient = window.supabase?.createClient("https://keowwzreupywfsbdtbvo.supabase.co", "sb_publishable_3CRJ63Xts15TJ6QyMzx2RA_VPzxYmMC");
let currentSession = null;
let currentUserIsAdmin = false;
let progressSaveTimer = null;
let readerProgressHandler = null;
let readerVisualProgressHandler = null;
function crumb(label){return '<div class="breadcrumb"><a href="#/">Works</a><span>/</span><span>'+esc(label)+'</span></div>'}
function renderHome(){

 const bookMark='<svg class="featured-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M7 10.5c6-2.5 12-1.7 17 2.1v26c-5-3.8-11-4.6-17-2.1zM41 10.5c-6-2.5-12-1.7-17 2.1v26c5-3.8 11-4.6 17-2.1z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M24 12.6v26" stroke="currentColor" stroke-width="1.3"/></svg>';
 app.innerHTML='<div class="home-layout"><section class="home-hero"><div class="kicker">A personal archive</div><h1>Last Station</h1><p class="intro">'+esc(config.message || 'Stories, notes, and things still being written.')+'</p>'+(featured?'<a class="featured-work" href="#/novel/'+encodeURIComponent(featured.id)+'"><span class="featured-topline"><span class="kicker">Featured work</span>'+bookMark+'</span><span class="featured-title">'+esc(featured.title)+'</span><span class="featured-description">'+esc(featured.description||'')+'</span><span class="featured-bottom"><span class="series-status">'+esc(featured.status||'In progress')+'</span><span class="featured-open">Open work ↗</span></span></a>':'')+'</section><section class="home-library"><label class="search-wrap"><svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m12.5 12.5 4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><input class="search" id="search" type="search" placeholder="Search the library…" aria-label="Search the library"></label><div class="section-label"><span>Collected works</span><span id="count"></span></div><div class="series-list" id="series-list"></div></section></div>';
 const search=document.getElementById('search'),list=document.getElementById('series-list'),count=document.getElementById('count');
 function paint(){const q=search.value.trim().toLowerCase();const filtered=allWorks.filter(w=>[w.title,w.type,w.description,w.status].some(v=>String(v||'').toLowerCase().includes(q)));count.textContent=String(filtered.length).padStart(2,'0');list.innerHTML=filtered.length?filtered.map((w,i)=>'<a class="series" href="#/novel/'+encodeURIComponent(w.id)+'"><span class="series-number">'+String(i+1).padStart(2,'0')+'</span><span><h2 class="series-title">'+esc(w.title)+'</h2><span class="series-sub">'+esc(w.type||'Novel')+' · '+esc(w.description||'')+'</span></span><span class="series-meta"><span class="series-status">'+esc(w.status||'In progress')+'</span><span class="arrow"> ↗</span></span></a>').join(''):'<div class="empty">No stories found.</div>'}
 search.addEventListener('input',paint);paint();
}
function renderNovel(id){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 document.title=w.title+' — Last Station';
 const chapters=w.chapters||[];
 const updated=w.lastActivity?new Date(w.lastActivity).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
 app.innerHTML=crumb(w.title)+'<section class="detail-head"><div class="kicker">'+esc(w.type||'Novel')+'</div><h1>'+esc(w.title)+'</h1><p class="detail-description">'+esc(w.longDescription||w.description||'')+'</p><div class="detail-tags"><span class="detail-tag-primary"><span class="status-dot" aria-hidden="true"></span>'+esc(w.status||'In progress')+'</span><span class="detail-tag">'+chapters.length+' available chapters</span>'+(updated?'<span class="detail-tag">Updated '+esc(updated)+'</span>':'')+'</div></section><div class="chapter-heading"><span class="chapter-heading-mark" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M3 4.5h14M3 10h10M3 15.5h7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></span>Chapters <span style="float:right">'+String(chapters.length).padStart(2,'0')+'</span></div><div class="chapter-list">'+(chapters.length?chapters.map((c,i)=>'<a class="chapter" href="#/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(c.id)+'"><span><span class="chapter-name">'+esc(c.title)+'</span><br><span class="chapter-sub">'+esc(c.status||'Not yet published')+'</span></span><span class="chapter-arrow">↗</span></a>').join(''):'<p class="empty">Chapters will appear here.</p>')+'</div>';
}
function renderReader(id,chapterId){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 const chapters=w.chapters||[];let index=chapters.findIndex(c=>c.id===chapterId);if(index<0)index=0;
 const c=chapters[index];if(!c){renderNovel(id);return}
 document.title=c.title+' — '+w.title;
 const content=c.content||'This chapter is a placeholder. Replace this text with your manuscript when it is ready.';
 app.innerHTML='<div id="reader-progress-track" class="reader-progress-track" aria-hidden="true"><span id="reader-progress-fill"></span></div><div class="reader-top"><a href="#/novel/'+encodeURIComponent(w.id)+'">← '+esc(w.title)+'</a><span>'+String(index+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0')+'</span></div><article><div class="reader-heading-rule" aria-hidden="true"><svg viewBox="0 0 44 12"><path d="M1 6h15m12 0h15M19 6l3-3 3 3-3 3z" fill="none" stroke="currentColor" stroke-width="1"/></svg></div><h1 class="reader-title">'+esc(formatChapterTitle(c.title))+'</h1><div class="prose">'+content.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+(c.authorNote?'<aside class="author-note"><div class="kicker">A note from the author</div>'+String(c.authorNote).split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</aside>':'')+(c.placeholder?'<div class="placeholder">PLACEHOLDER TEXT · Replace the chapter content in <code>works.js</code>. The reading layout and chapter navigation are already wired up.</div>':'')+'<div class="reader-end"><svg viewBox="0 0 44 12" aria-hidden="true"><path d="M1 6h15m12 0h15M19 6l3-3 3 3-3 3z" fill="none" stroke="currentColor" stroke-width="1"/></svg><span>END OF CHAPTER</span></div></article><div class="reader-controls"><button class="reader-btn" id="prev" '+(index===0?'disabled':'')+'>← Previous</button><a class="reader-btn" href="#/novel/'+encodeURIComponent(w.id)+'">Chapter list</a><button class="reader-btn" id="next" '+(index===chapters.length-1?'disabled':'')+'>Next →</button></div>';
 const prev=document.getElementById('prev'),next=document.getElementById('next');
 if(index>0)prev.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index-1].id));
 if(index<chapters.length-1)next.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index+1].id));
 if(readerVisualProgressHandler)window.removeEventListener('scroll',readerVisualProgressHandler);
 const progressFill=document.getElementById('reader-progress-fill');
 readerVisualProgressHandler=()=>{const max=document.documentElement.scrollHeight-window.innerHeight;const percent=max>0?Math.max(0,Math.min(100,(window.scrollY/max)*100)):0;if(progressFill)progressFill.style.width=percent+'%';};
 window.addEventListener('scroll',readerVisualProgressHandler,{passive:true});readerVisualProgressHandler();
 trackReaderProgress(w,c);
}

async function refreshFromDatabase(shouldRender=true){
 if(!supabaseClient) return;
 try{
  const sessionResult=await supabaseClient.auth.getSession();
  currentSession=sessionResult.data.session;
  currentUserIsAdmin=false;
  if(currentSession){
   const roleResult=await supabaseClient.from("author_admins").select("user_id").eq("user_id",currentSession.user.id).maybeSingle();
   currentUserIsAdmin=!!roleResult.data;
  }
  const novelsResult=await supabaseClient.from("novels").select("*").order("sort_order");
  if(novelsResult.error) throw novelsResult.error;
  const chaptersResult=await supabaseClient.from("chapters").select("*").order("chapter_number");
  if(chaptersResult.error) throw chaptersResult.error;
  const chaptersByNovel={};
  (chaptersResult.data||[]).forEach(ch=>{
   if(!currentUserIsAdmin&&!ch.is_published) return;
   if(!chaptersByNovel[ch.novel_id]) chaptersByNovel[ch.novel_id]=[];
   chaptersByNovel[ch.novel_id].push({id:ch.slug, databaseId:ch.id, title:ch.title, status:ch.status, placeholder:false, content:ch.body, authorNote:ch.author_note||'', chapterNumber:ch.chapter_number, isPublished:ch.is_published, updatedAt:ch.updated_at});
  });
  allWorks=(novelsResult.data||[]).filter(n=>currentUserIsAdmin||n.is_published).map(n=>{const chapters=chaptersByNovel[n.id]||[];const activity=[n.updated_at,...chapters.map(ch=>ch.updatedAt)].filter(Boolean).sort().pop();return {id:n.id,title:n.title,type:n.genre,status:n.status,description:n.description,longDescription:n.long_description,updatedAt:n.updated_at,lastActivity:activity,chapters};});
  if(shouldRender) render();
 }catch(error){console.error("Supabase loading failed:",error);}
}
function saveReaderProgress(work,chapter,scrollPercent){
 if(!supabaseClient||!currentSession) return;
 const payload={user_id:currentSession.user.id,novel_id:work.id,chapter_id:work.id+"-"+chapter.id,scroll_percent:Math.max(0,Math.min(100,Math.round(scrollPercent))),updated_at:new Date().toISOString()};
 supabaseClient.from("reader_progress").upsert(payload,{onConflict:"user_id,novel_id"}).then(({error})=>{if(error)console.error("Could not save reading progress:",error);});
}
function trackReaderProgress(work,chapter){
 if(readerProgressHandler) window.removeEventListener("scroll",readerProgressHandler);
 const update=()=>{
  if(progressSaveTimer) clearTimeout(progressSaveTimer);
  progressSaveTimer=setTimeout(()=>{
   const max=document.documentElement.scrollHeight-window.innerHeight;
   const percent=max>0?(window.scrollY/max)*100:0;
   saveReaderProgress(work,chapter,percent);
  },900);
 };
 readerProgressHandler=update;
 window.addEventListener("scroll",readerProgressHandler,{passive:true});
}
async function renderAccount(){

   if(result.error){message.textContent=result.error.message;return;}

  });

 }
 const role=await supabaseClient.from("author_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
 currentUserIsAdmin=!!role.data;
 const progressResult=await supabaseClient.from("reader_progress").select("*").eq("user_id",session.user.id).order("updated_at",{ascending:false});
 const progress=progressResult.data||[];
 const progressHtml=progress.length?progress.map(p=>{
  const w=allWorks.find(item=>item.id===p.novel_id),ch=w&&(w.chapters||[]).find(item=>item.databaseId===p.chapter_id);
  return '<a class="progress-row" href="#/read/'+encodeURIComponent(p.novel_id)+'/'+encodeURIComponent(ch?ch.id:"chapter-1")+'"><span><strong>'+esc(w?w.title:p.novel_id)+'</strong><br><span class="form-note">'+esc(ch?ch.title:"Last read chapter")+'</span></span><span class="progress-percent">'+p.scroll_percent+'%</span></a>';
 }).join(""):'<p class="form-note">Your reading progress will appear here after you read a chapter while signed in.</p>';
 const workOptions=allWorks.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.title)+'</option>').join("");
 const chapters=allWorks.flatMap(w=>(w.chapters||[]).map(ch=>({...ch,workId:w.id,workTitle:w.title})));
 const chapterOptions=chapters.map(ch=>'<option value="'+esc(ch.databaseId||ch.workId+"-"+ch.id)+'">'+esc(ch.workTitle+' · '+ch.title+(ch.isPublished?' · Published':' · Draft'))+'</option>').join("");
 panel.innerHTML='<div class="account-status"><p>Signed in as <strong>'+esc(session.user.email||"reader")+'</strong></p><button id="signout" class="reader-btn" type="button">Sign out</button></div><section class="account-section"><div class="chapter-heading">Reading progress</div>'+progressHtml+'</section>'+(currentUserIsAdmin?'<section class="account-section"><div class="kicker">Author workspace</div><h2>Chapter editor</h2><form id="work-status-form" class="account-form"><label>Work<select name="work_id" required>'+allWorks.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.title)+'</option>').join("")+'</select></label><label>Activity status<select name="status"><option value="In progress">In progress</option><option value="On hiatus">On hiatus</option><option value="Completed">Completed</option><option value="Planned">Planned</option></select></label><div class="form-actions"><button class="reader-btn" type="submit">Save work status</button></div><p id="work-status-message" class="form-note" role="status"></p></form><h2 style="margin-top:28px">Chapter editor</h2><p class="form-note">Select a saved chapter to edit it, or start a new one. Draft is the default. Preview before publishing; author notes are shown separately from the chapter text.</p><div class="account-form"><label>Edit an existing chapter<select id="existing-chapter"><option value="">Create a new chapter…</option>'+chapterOptions+'</select></label><div class="form-actions"><button id="load-chapter" class="reader-btn" type="button">Load selected chapter</button><button id="new-chapter" class="reader-btn" type="button">New chapter</button></div><p id="chapter-message" class="form-note" role="status"></p><form id="chapter-form" class="account-form"><label>Novel<select name="novel_id" required>'+workOptions+'</select></label><div class="form-grid"><label>Chapter number<input name="chapter_number" type="number" min="1" required></label><label>Chapter slug<input name="slug" pattern="[a-z0-9-]+" placeholder="chapter-4" required></label></div><label>Chapter title<input name="title" required></label><label>Chapter text<textarea name="body" rows="14" required></textarea></label><label>Author note <span class="form-note">(optional, shown after the chapter)</span><textarea name="author_note" rows="4" placeholder="A brief note about this chapter, a dedication, or context for readers."></textarea></label><label class="check-label"><input name="publish" type="checkbox"> Publish this chapter</label><div class="form-actions"><button class="reader-btn" type="button" id="preview-chapter">Preview chapter</button><button class="reader-btn" type="submit">Save chapter</button></div></form><div id="chapter-preview" class="chapter-preview" hidden></div></div></section>':'<section class="account-section"><div class="chapter-heading">Author access</div><p class="form-note">This account can save reading progress. Author tools appear after author access is granted in the database.</p></section>');
 document.getElementById("signout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();currentSession=null;currentUserIsAdmin=false;await refreshFromDatabase(false);renderAccount();});
 if(!currentUserIsAdmin)return;
 const statusForm=document.getElementById("work-status-form");
 statusForm.elements.status.value=allWorks.find(w=>w.id===statusForm.elements.work_id.value)?.status||"In progress";
 statusForm.elements.work_id.addEventListener("change",()=>{statusForm.elements.status.value=allWorks.find(w=>w.id===statusForm.elements.work_id.value)?.status||"In progress";});
 statusForm.addEventListener("submit",async event=>{
  event.preventDefault();
  const message=document.getElementById("work-status-message");
  const workId=statusForm.elements.work_id.value,status=statusForm.elements.status.value;
  message.textContent="Saving status…";
  const result=await supabaseClient.from("novels").update({status,updated_at:new Date().toISOString()}).eq("id",workId);
  if(result.error){message.textContent="Could not update status: "+result.error.message;return;}
  message.textContent="Work status updated.";
  await refreshFromDatabase(false);renderAccount();
 });
 const chapterForm=document.getElementById("chapter-form"),message=document.getElementById("chapter-message"),existing=document.getElementById("existing-chapter"),preview=document.getElementById("chapter-preview");
 function resetEditor(){chapterForm.reset();chapterForm.elements.novel_id.value=allWorks[0]?.id||"";chapterForm.elements.publish.checked=false;existing.value="";preview.hidden=true;preview.innerHTML="";message.textContent="New chapter draft. Nothing is published until you check the publish box and save.";}
 function renderPreview(){
  const title=chapterForm.elements.title.value.trim()||"Untitled chapter",body=chapterForm.elements.body.value,note=chapterForm.elements.author_note.value;
  preview.innerHTML='<div class="preview-toolbar"><span class="kicker">Preview · not published</span><button type="button" class="text-link" id="close-preview">Close preview</button></div><article><h2 class="reader-title">'+esc(formatChapterTitle(title))+'</h2><div class="prose">'+body.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+(note.trim()?'<aside class="author-note"><div class="kicker">A note from the author</div>'+note.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</aside>':'')+'</article>';
  preview.hidden=false;document.getElementById("close-preview").addEventListener("click",()=>{preview.hidden=true;});
 }
 document.getElementById("new-chapter").addEventListener("click",resetEditor);
 document.getElementById("preview-chapter").addEventListener("click",renderPreview);
 document.getElementById("load-chapter").addEventListener("click",()=>{
  const selected=chapters.find(ch=>(ch.databaseId||ch.workId+"-"+ch.id)===existing.value);
  if(!selected){message.textContent="Choose a saved chapter first, or start a new one.";return;}
  chapterForm.elements.novel_id.value=selected.workId;chapterForm.elements.chapter_number.value=selected.chapterNumber||1;
  chapterForm.elements.slug.value=selected.id;chapterForm.elements.title.value=selected.title;
  chapterForm.elements.body.value=selected.content||"";chapterForm.elements.author_note.value=selected.authorNote||"";
  chapterForm.elements.publish.checked=!!selected.isPublished;preview.hidden=true;
  message.textContent="Loaded "+selected.title+". Review carefully before saving changes.";
 });
 chapterForm.addEventListener("submit",async event=>{
  event.preventDefault();
  const fd=new FormData(chapterForm),novelId=String(fd.get("novel_id")),slug=String(fd.get("slug")).trim(),number=Number(fd.get("chapter_number")),published=fd.get("publish")==="on";
  if(!/^[a-z0-9-]+$/.test(slug)){message.textContent="Use only lowercase letters, numbers, and hyphens in the slug.";return;}
  if(!Number.isInteger(number)||number<1){message.textContent="Chapter number must be a positive whole number.";return;}
  message.textContent="Saving chapter…";
  const payload={id:novelId+"-"+slug,novel_id:novelId,slug,title:String(fd.get("title")).trim(),body:String(fd.get("body")),author_note:String(fd.get("author_note")||"").trim(),chapter_number:number,status:published?"Published":"Draft",is_published:published,published_at:published?new Date().toISOString():null,updated_at:new Date().toISOString()};
  const result=await supabaseClient.from("chapters").upsert(payload,{onConflict:"id"});
  if(result.error){message.textContent="Could not save chapter: "+result.error.message;return;}
  message.textContent=published?"Chapter saved and published.":"Chapter saved as a draft.";
  await refreshFromDatabase(false);
  renderAccount();
 });
}
function renderSettings(){
 document.title="Reading settings — Last Station";
 const themes=[["dark","Dark"],["light","Light"],["pale","Pale green"],["sepia","Sepia"],["midnight","Midnight blue"],["forest","Forest"],["slate","Slate"]];
 let html=crumb("Settings") + '<div class="kicker">Your reading experience</div><h1>Make it comfortable.</h1><p class="intro">Choose a page tone and typeface that make long chapters easier on your eyes. Your settings are saved on this device.</p><div class="settings-panel">';
 html+='<section class="settings-group"><h2>Page theme</h2><p class="settings-help">Change the background and text colors across the site.</p><div class="theme-options">';
 html+=themes.map(([id,label])=>'<button class="theme-choice" type="button" data-theme-choice="' + id + '" aria-pressed="' + (preferences.theme===id) + '">' + label + '</button>').join("");
 html+='</div></section><section class="settings-group"><h2>Reading font</h2><p class="settings-help">This changes the novel text, not the navigation or interface.</p><div class="settings-control"><label for="reading-font-choice">Typeface</label><select id="reading-font-choice">';
 html+=Object.entries(fontChoices).map(([id,f])=>'<option value="' + id + '" ' + (preferences.font===id?"selected":"") + '>' + f.label + '</option>').join("");
 html+='</select></div><div class="font-preview">A quiet line of prose, set in your chosen typeface.</div></section><section class="settings-group"><h2>Text size</h2><p class="settings-help">Adjust the reading text without zooming the entire page.</p><div class="settings-control"><label for="reading-size-choice">Font size: <span id="reading-size-value">' + preferences.fontSize + ' px</span></label><input id="reading-size-choice" type="range" min="14" max="24" step="1" value="' + preferences.fontSize + '"></div></section><section class="settings-group"><h2>Line spacing</h2><p class="settings-help">Give dense paragraphs more breathing room, or fit more text on screen.</p><div class="settings-control"><label for="reading-line-choice">Line spacing: <span id="reading-line-value">' + Number(preferences.lineHeight).toFixed(1) + '×</span></label><input id="reading-line-choice" type="range" min="1.5" max="2.4" step="0.1" value="' + preferences.lineHeight + '"></div></section><div class="settings-actions"><button id="save-settings" class="reader-btn" type="button">Save changes</button><button id="reset-settings" class="reader-btn" type="button">Reset defaults</button><button id="return-settings" class="reader-btn" type="button">Return to previous page</button></div><p id="settings-status" class="form-note" role="status" style="margin-top:14px">Changes preview immediately. Select Save changes to confirm and keep them on this device.</p><p class="form-note" style="margin-top:8px">Preferences are stored locally in this browser. They are not tied to your reader account yet.</p></div>';
 app.innerHTML=html;
 const status=document.getElementById("settings-status");
 function previewSettings(){applyPreferences();if(status)status.textContent="Preview updated. Select Save changes to confirm your choices."}
 document.querySelectorAll("[data-theme-choice]").forEach(button=>button.addEventListener("click",()=>{preferences.theme=button.dataset.themeChoice;previewSettings();document.querySelectorAll("[data-theme-choice]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));}));
 document.getElementById("reading-font-choice").addEventListener("change",event=>{preferences.font=event.target.value;previewSettings()});
 document.getElementById("reading-size-choice").addEventListener("input",event=>{preferences.fontSize=Number(event.target.value);document.getElementById("reading-size-value").textContent=preferences.fontSize+" px";previewSettings()});
 document.getElementById("reading-line-choice").addEventListener("input",event=>{preferences.lineHeight=Number(event.target.value);document.getElementById("reading-line-value").textContent=preferences.lineHeight.toFixed(1)+"×";previewSettings()});
 document.getElementById("save-settings").addEventListener("click",()=>{applyPreferences();if(status)status.textContent="Saved. Your reading settings will be remembered in this browser."});
 document.getElementById("reset-settings").addEventListener("click",()=>{preferences={...preferenceDefaults};applyPreferences();renderSettings()});
 document.getElementById("return-settings").addEventListener("click",()=>{
  location.hash = '#' + settingsReturnRoute;
 });
}
function renderAbout(){
 document.title='About — Last Station';
 const aboutText='This is a home for the stories I am working on, the ones that are finished, and the ones that are not ready to leave the notebook yet.\n\nMore works are sure to come. I\'m at my last station and there\'s no train coming to pick me up anyways, so I\'ll just keep writing.\n\n-Demented Poet';
 const aboutParagraphs=aboutText.split(/\n\s*\n/).map(p=>'<p class="intro">'+esc(p)+'</p>').join('');
 app.innerHTML=crumb('About')+'<div class="kicker">A note from the author</div><h1>Still in transit.</h1>'+aboutParagraphs+'<p><a class="text-link" href="#/">← Back to the library</a></p>';
}
function render(){const parts=route().split('/').filter(Boolean);if(parts[0]==='novel'&&parts[1])renderNovel(parts[1]);else if(parts[0]==='read'&&parts[1])renderReader(parts[1],parts[2]);else if(parts[0]==='about')renderAbout();else if(parts[0]==='account')renderAccount();else if(parts[0]==='settings')renderSettings();else renderHome();applyPreferences();window.scrollTo(0,0)}
function handleHashChange(event){
 const nextRoute=route();
 let previousRoute='/';
 try{if(event.oldURL){const oldHash=event.oldURL.split('#')[1]||'/';previousRoute='/'+decodeURIComponent(oldHash).replace(/^\/+/, '');if(oldHash==='/'||oldHash==='')previousRoute='/';}}catch{}
 if(nextRoute==='/settings'&&previousRoute!=='/settings'){
  if(!settingsReturnPending){
   settingsReturnRoute=previousRoute;
   settingsReturnScroll=window.scrollY;
   try{sessionStorage.setItem('last-station-settings-return',JSON.stringify({route:settingsReturnRoute,scroll:settingsReturnScroll}));}catch{}
  }
  settingsReturnPending=false;
 }
 const returningFromSettings=previousRoute==='/settings'&&nextRoute===settingsReturnRoute;
 render();
 if(returningFromSettings)requestAnimationFrame(()=>window.scrollTo(0,settingsReturnScroll));
}
if(supabaseClient){supabaseClient.auth.onAuthStateChange((_event,session)=>{currentSession=session;setTimeout(async()=>{await refreshFromDatabase(false);if(route().startsWith("/account"))renderAccount();},0);});}
document.querySelectorAll('a[href="#/settings"]').forEach(link=>link.addEventListener('click',()=>{
 settingsReturnRoute=route();
 settingsReturnScroll=window.scrollY;
 settingsReturnPending=true;
 try{sessionStorage.setItem('last-station-settings-return',JSON.stringify({route:settingsReturnRoute,scroll:settingsReturnScroll}));}catch{}
}));
window.addEventListener('hashchange',handleHashChange);render();refreshFromDatabase();
})();
</script>
