<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111"><meta name="description" content="Last Station. A personal archive of my novels and stories.">
<title>Last Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=Lora:wght@400;500&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111;--surface:#171717;--text:#e9e7e2;--muted:#93918b;--dim:#66645f;--line:#30302d;--accent:#c5c0b4;--serif:"Literata",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--mono:"DM Mono",monospace;--reading-font:"Literata",Georgia,serif;--reading-size:17px;--reading-line-height:2}
body[data-theme="light"]{color-scheme:light;--bg:#faf9f6;--surface:#fff;--text:#25241f;--muted:#6f6c64;--dim:#8b887f;--line:#dedbd3;--accent:#4f4b43}
body[data-theme="pale"]{color-scheme:light;--bg:#f0f3ee;--surface:#f9fbf7;--text:#29332d;--muted:#68756b;--dim:#89948a;--line:#d4ddd3;--accent:#496453}
body[data-theme="sepia"]{color-scheme:light;--bg:#f2e8d5;--surface:#f8f0e2;--text:#433426;--muted:#7c6955;--dim:#9b876f;--line:#d9c9b1;--accent:#785c3e}
body[data-theme="midnight"]{color-scheme:dark;--bg:#101827;--surface:#172235;--text:#e2e8f0;--muted:#9aa8bd;--dim:#718097;--line:#2b3a50;--accent:#b9cbe5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 var(--sans);min-height:100vh}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{color:inherit}.wrap{width:min(900px,calc(100% - 40px));margin:0 auto}.header{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font:500 18px var(--serif);letter-spacing:-.03em}.nav{display:flex;gap:24px;color:var(--muted);font-size:12px}.nav a:hover,.text-link:hover{color:var(--text)}.page{padding:60px 0 90px}.kicker{font:10px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font:400 clamp(42px,7vw,66px)/1.1 var(--serif);letter-spacing:-.055em;margin:16px 0 15px}h2{font:400 28px/1.3 var(--serif);letter-spacing:-.035em;margin-bottom:8px}.intro{color:var(--muted);max-width:480px;margin-bottom:40px}.search{width:100%;padding:12px 0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--text);outline:none;font-size:13px;margin-bottom:34px}.search:focus{border-color:#888}.search::placeholder{color:var(--dim)}.section-label{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:0;color:var(--muted);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.series-list{display:flex;flex-direction:column}.series{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line);transition:padding .18s;cursor:pointer}.series:hover{padding-left:6px;padding-right:6px}.series-number{color:var(--dim);font:11px var(--mono)}.series-title{font:400 21px/1.35 var(--serif);margin:0 0 5px}.series-sub{color:var(--muted);font-size:12px}.series-meta{text-align:right;color:var(--muted);font:10px/1.8 var(--mono)}.arrow{font-size:17px;color:var(--dim);margin-left:12px}.series:hover .arrow{color:var(--text)}.empty{padding:28px 0;color:var(--muted)}.foot{border-top:1px solid var(--line);padding:20px 0 28px;display:flex;justify-content:space-between;color:var(--dim);font:10px var(--mono);letter-spacing:.03em}
.breadcrumb{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:40px}.breadcrumb a:hover{color:var(--text)}.detail-head{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:30px}.detail-head h1{font-size:clamp(38px,6vw,56px);max-width:680px}.detail-description{color:var(--muted);max-width:590px;margin:18px 0 20px}.detail-tags{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em}.chapter-heading{font:10px var(--mono);text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-bottom:8px}.chapter-list{border-top:1px solid var(--line)}.chapter{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}.chapter:hover .chapter-name{color:#fff}.chapter-name{font-size:13px}.chapter-sub{color:var(--dim);font:10px var(--mono)}.chapter-arrow{color:var(--dim)}
.reader-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.reader-title{font:400 clamp(32px,5vw,46px)/1.25 var(--serif);letter-spacing:-.035em;margin:42px 0 8px}.reader-chapter{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:42px}.prose{max-width:650px;margin:0 auto;font-family:var(--reading-font);font-size:var(--reading-size);line-height:var(--reading-line-height);font-weight:400;color:var(--text);white-space:pre-line}.prose p{margin-bottom:1.6em}.placeholder{border-left:2px solid #5b5a54;padding:12px 18px;margin:30px 0;color:var(--muted);font:12px/1.8 var(--sans)}.settings-panel{max-width:650px}.settings-group{padding:22px 0;border-bottom:1px solid var(--line)}.settings-group h2{font-size:21px;margin-bottom:7px}.settings-help{color:var(--muted);font-size:12px;margin-bottom:16px}.settings-control{display:grid;gap:8px;max-width:420px}.settings-control label{font-size:12px;color:var(--muted)}.settings-control select,.settings-control input{width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:2px}.theme-options{display:flex;gap:8px;flex-wrap:wrap}.theme-choice{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 12px;cursor:pointer;font-size:12px}.theme-choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.settings-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.reader-controls{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:60px;padding-top:20px}.reader-btn{background:transparent;border:1px solid var(--line);padding:10px 14px;font-size:12px;cursor:pointer}.reader-btn:hover:not(:disabled){border-color:#777}.reader-btn:disabled{opacity:.3;cursor:not-allowed}.reader-end{text-align:center;margin:38px 0;color:var(--dim);font:10px var(--mono);letter-spacing:.12em}
@media(max-width:600px){.wrap{width:calc(100% - 32px)}.page{padding:42px 0 65px}.header{height:66px}.nav{gap:15px}.series{grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:19px 0}.series-title{font-size:18px}.series-meta{font-size:9px}.intro{margin-bottom:30px}.reader-top{align-items:flex-start}.prose{font-family:var(--reading-font);font-size:var(--reading-size);line-height:var(--reading-line-height)}.foot{gap:15px;flex-direction:column}.detail-head{margin-bottom:25px}.reader-title{margin-top:32px}.reader-chapter{margin-bottom:30px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}

.account-panel{max-width:650px}.account-form{display:grid;gap:16px}.account-form label{display:grid;gap:7px;color:var(--muted);font-size:12px}.account-form input,.account-form select,.account-form textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:11px 12px;border-radius:2px;outline:none}.account-form textarea{resize:vertical;font:14px/1.8 var(--serif)}.account-form input:focus,.account-form select:focus,.account-form textarea:focus{border-color:#888}.form-actions,.account-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.form-note{color:var(--muted);font-size:11px;line-height:1.7}.form-grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.check-label{display:flex!important;grid-template-columns:auto 1fr;align-items:center;justify-content:start;gap:10px!important}.check-label input{width:auto}.account-section{margin-top:38px;padding-top:24px;border-top:1px solid var(--line)}.account-status{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}.progress-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.progress-row strong{font-weight:500}.progress-percent{font:11px var(--mono);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="header"><a href="#/" class="logo">Last Station</a><nav class="nav"><a href="#/">Works</a><a href="#/about">About</a><a href="#/account">Account</a><a href="#/settings">Settings</a></nav></header>
<main id="app" class="page" aria-live="polite"></main>
<footer class="foot"><span>LAST STATION © <span id="year"></span></span><span>For the stories still on their way.</span></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<script src="./works.js"></script>
<script>
(() => {
const config = window.LAST_STATION || {siteTitle:'Last Station',message:'A place for stories still on their way.',works:[]};
const app = document.getElementById('app');
document.getElementById('year').textContent = new Date().getFullYear();
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatChapterTitle = title => String(title || '').replace(/\bchapter\s*(\d+)/i, 'Chapter $1').replace(/\s*[·•]\s*/, ' - ');
const route = () => decodeURIComponent(location.hash.slice(1) || '/');
const preferenceDefaults={theme:"dark",font:"literata",fontSize:17,lineHeight:2};
function loadPreferences(){try{return {...preferenceDefaults,...JSON.parse(localStorage.getItem("last-station-reading-settings")||"{}")}}catch{return {...preferenceDefaults}}}
let preferences=loadPreferences();
let settingsReturnRoute = '/';
let settingsReturnScroll = 0;
try {
 const savedReturn = JSON.parse(sessionStorage.getItem('last-station-settings-return') || 'null');
 if(savedReturn && typeof savedReturn.route === 'string' && savedReturn.route !== '/settings'){
  settingsReturnRoute = savedReturn.route;
  settingsReturnScroll = Number(savedReturn.scroll) || 0;
 }
} catch {}
const fontChoices={literata:{label:"Literata (literary serif)",value:'"Literata", Georgia, serif'},lora:{label:"Lora (classic book serif)",value:'"Lora", Georgia, serif'},merriweather:{label:"Merriweather (clear serif)",value:'"Merriweather", Georgia, serif'},sans:{label:"DM Sans (clean sans-serif)",value:'"DM Sans", Arial, sans-serif'},georgia:{label:"Georgia (system serif)",value:"Georgia, serif"},system:{label:"System default",value:"system-ui, sans-serif"}};
function applyPreferences(){document.body.dataset.theme=preferences.theme;document.documentElement.style.setProperty("--reading-font",fontChoices[preferences.font]?.value||fontChoices.literata.value);document.documentElement.style.setProperty("--reading-size",String(preferences.fontSize)+"px");document.documentElement.style.setProperty("--reading-line-height",String(preferences.lineHeight));try{localStorage.setItem("last-station-reading-settings",JSON.stringify(preferences))}catch{}}
let allWorks = config.works || [];
const supabaseClient = window.supabase?.createClient("https://keowwzreupywfsbdtbvo.supabase.co", "sb_publishable_3CRJ63Xts15TJ6QyMzx2RA_VPzxYmMC");
let currentSession = null;
let currentUserIsAdmin = false;
let progressSaveTimer = null;
let readerProgressHandler = null;
function crumb(label){return '<div class="breadcrumb"><a href="#/">Works</a><span>/</span><span>'+esc(label)+'</span></div>'}
function renderHome(){
 document.title='Last Station';
 app.innerHTML='<div class="kicker">A personal archive</div><h1>Last Station</h1><p class="intro">'+esc(config.message || 'Stories, notes, and things still being written.')+'</p><input class="search" id="search" type="search" placeholder="Search stories…" aria-label="Search stories"><div class="section-label"><span>Collected works</span><span id="count"></span></div><div class="series-list" id="series-list"></div>';
 const search=document.getElementById('search'),list=document.getElementById('series-list'),count=document.getElementById('count');
 function paint(){const q=search.value.trim().toLowerCase();const filtered=allWorks.filter(w=>[w.title,w.type,w.description].some(v=>String(v||'').toLowerCase().includes(q)));count.textContent=String(filtered.length).padStart(2,'0');list.innerHTML=filtered.length?filtered.map((w,i)=>'<a class="series" href="#/novel/'+encodeURIComponent(w.id)+'"><span class="series-number">'+String(i+1).padStart(2,'0')+'</span><span><h2 class="series-title">'+esc(w.title)+'</h2><span class="series-sub">'+esc(w.type||'Novel')+' · '+esc(w.description||'')+'</span></span><span class="series-meta">'+esc(w.status||'In progress')+'<span class="arrow"> ↗</span></span></a>').join(''):'<div class="empty">No stories found.</div>'}
 search.addEventListener('input',paint);paint();
}
function renderNovel(id){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 document.title=w.title+' — Last Station';
 const chapters=w.chapters||[];
 app.innerHTML=crumb(w.title)+'<section class="detail-head"><div class="kicker">'+esc(w.type||'Novel')+'</div><h1>'+esc(w.title)+'</h1><p class="detail-description">'+esc(w.longDescription||w.description||'')+'</p><div class="detail-tags"><span>'+esc(w.status||'In progress')+'</span><span>'+chapters.length+' chapters planned</span></div></section><div class="chapter-heading">Chapters <span style="float:right">'+String(chapters.length).padStart(2,'0')+'</span></div><div class="chapter-list">'+(chapters.length?chapters.map((c,i)=>'<a class="chapter" href="#/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(c.id)+'"><span><span class="chapter-name">'+esc(c.title)+'</span><br><span class="chapter-sub">'+esc(c.status||'Not yet published')+'</span></span><span class="chapter-arrow">↗</span></a>').join(''):'<p class="empty">Chapters will appear here.</p>')+'</div>';
}
function renderReader(id,chapterId){
 const w=allWorks.find(x=>x.id===id);if(!w){renderHome();return}
 const chapters=w.chapters||[];let index=chapters.findIndex(c=>c.id===chapterId);if(index<0)index=0;
 const c=chapters[index];if(!c){renderNovel(id);return}
 document.title=c.title+' — '+w.title;
 const content=c.content||'This chapter is a placeholder. Replace this text with your manuscript when it is ready.';
 app.innerHTML='<div class="reader-top"><a href="#/novel/'+encodeURIComponent(w.id)+'">← '+esc(w.title)+'</a><span>'+String(index+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0')+'</span></div><article><h1 class="reader-title">'+esc(formatChapterTitle(c.title))+'</h1><div class="prose">'+content.split(/\n\s*\n/).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'+(c.placeholder?'<div class="placeholder">PLACEHOLDER TEXT · Replace the chapter content in <code>works.js</code>. The reading layout and chapter navigation are already wired up.</div>':'')+'<div class="reader-end">— END OF CHAPTER —</div></article><div class="reader-controls"><button class="reader-btn" id="prev" '+(index===0?'disabled':'')+'>← Previous</button><a class="reader-btn" href="#/novel/'+encodeURIComponent(w.id)+'">Chapter list</a><button class="reader-btn" id="next" '+(index===chapters.length-1?'disabled':'')+'>Next →</button></div>';
 const prev=document.getElementById('prev'),next=document.getElementById('next');
 if(index>0)prev.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index-1].id));
 if(index<chapters.length-1)next.addEventListener('click',()=>location.hash='/read/'+encodeURIComponent(w.id)+'/'+encodeURIComponent(chapters[index+1].id));
 trackReaderProgress(w,c);
}

async function refreshFromDatabase(shouldRender=true){
 if(!supabaseClient) return;
 try{
  const sessionResult=await supabaseClient.auth.getSession();
  currentSession=sessionResult.data.session;
  currentUserIsAdmin=false;
  if(currentSession){
   const roleResult=await supabaseClient.from("author_admins").select("user_id").eq("user_id",currentSession.user.id).maybeSingle();
   currentUserIsAdmin=!!roleResult.data;
  }
  const novelsResult=await supabaseClient.from("novels").select("*").order("sort_order");
  if(novelsResult.error) throw novelsResult.error;
  const chaptersResult=await supabaseClient.from("chapters").select("*").order("chapter_number");
  if(chaptersResult.error) throw chaptersResult.error;
  const chaptersByNovel={};
  (chaptersResult.data||[]).forEach(ch=>{
   if(!chaptersByNovel[ch.novel_id]) chaptersByNovel[ch.novel_id]=[];
   chaptersByNovel[ch.novel_id].push({id:ch.slug, databaseId:ch.id, title:ch.title, status:ch.status, placeholder:false, content:ch.body, chapterNumber:ch.chapter_number, isPublished:ch.is_published});
  });
  allWorks=(novelsResult.data||[]).map(n=>({id:n.id,title:n.title,type:n.genre,status:n.status,description:n.description,longDescription:n.long_description,chapters:chaptersByNovel[n.id]||[]}));
  if(shouldRender) render();
 }catch(error){console.error("Supabase loading failed:",error);}
}
function saveReaderProgress(work,chapter,scrollPercent){
 if(!supabaseClient||!currentSession) return;
 const payload={user_id:currentSession.user.id,novel_id:work.id,chapter_id:work.id+"-"+chapter.id,scroll_percent:Math.max(0,Math.min(100,Math.round(scrollPercent))),updated_at:new Date().toISOString()};
 supabaseClient.from("reader_progress").upsert(payload,{onConflict:"user_id,novel_id"}).then(({error})=>{if(error)console.error("Could not save reading progress:",error);});
}
function trackReaderProgress(work,chapter){
 if(readerProgressHandler) window.removeEventListener("scroll",readerProgressHandler);
 const update=()=>{
  if(progressSaveTimer) clearTimeout(progressSaveTimer);
  progressSaveTimer=setTimeout(()=>{
   const max=document.documentElement.scrollHeight-window.innerHeight;
   const percent=max>0?(window.scrollY/max)*100:0;
   saveReaderProgress(work,chapter,percent);
  },900);
 };
 readerProgressHandler=update;
 window.addEventListener("scroll",readerProgressHandler,{passive:true});
}
async function renderAccount(){
 document.title="Account — Last Station";
 app.innerHTML=crumb("Account")+'<div class="kicker">Reader account</div><h1>Your reading desk.</h1><p class="intro">Sign in to keep your reading progress synced across devices.</p><div id="account-panel" class="account-panel">Loading account…</div>';
 const panel=document.getElementById("account-panel");
 if(!supabaseClient){panel.textContent="The account service is not available right now.";return;}
 const {data:{session}}=await supabaseClient.auth.getSession();
 currentSession=session;
 if(!session){
  panel.innerHTML='<form id="auth-form" class="account-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="current-password" required></label><div class="form-actions"><button class="reader-btn" type="submit" name="mode" value="signin">Sign in</button><button class="reader-btn" type="submit" name="mode" value="signup">Create account</button></div><p class="form-note">Use a password you do not use elsewhere. Account creation may require email confirmation.</p><p id="auth-message" class="form-note" role="status"></p></form>';
  const form=document.getElementById("auth-form");
  form.addEventListener("submit",async event=>{
   event.preventDefault();
   const button=event.submitter;
   const mode=button&&button.value==="signup"?"signup":"signin";
   const email=form.elements.email.value.trim();
   const password=form.elements.password.value;
   const message=document.getElementById("auth-message");
   message.textContent=mode==="signup"?"Creating account…":"Signing in…";
   let result;
   if(mode==="signup") result=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname+"#/account"}});
   else result=await supabaseClient.auth.signInWithPassword({email,password});
   if(result.error){message.textContent=result.error.message;return;}
   if(mode==="signup"&&!result.data.session){message.textContent="Account created. Check your email to confirm it, then sign in.";}
   else{message.textContent="Signed in. Loading your account…";await refreshFromDatabase(false);renderAccount();}
  });
  return;
 }
 const role=await supabaseClient.from("author_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
 currentUserIsAdmin=!!role.data;
 const progressResult=await supabaseClient.from("reader_progress").select("*").eq("user_id",session.user.id).order("updated_at",{ascending:false});
 const progress=progressResult.data||[];
 const progressHtml=progress.length?progress.map(p=>{
  const w=allWorks.find(item=>item.id===p.novel_id);
  const ch=w&&(w.chapters||[]).find(item=>item.databaseId===p.chapter_id);
  return '<a class="progress-row" href="#/read/'+encodeURIComponent(p.novel_id)+'/'+encodeURIComponent(ch?ch.id:"chapter-1")+'"><span><strong>'+esc(w?w.title:p.novel_id)+'</strong><br><span class="form-note">'+esc(ch?ch.title:"Last read chapter")+'</span></span><span class="progress-percent">'+p.scroll_percent+'%</span></a>';
 }).join(""):'<p class="form-note">Your reading progress will appear here after you read a chapter while signed in.</p>';
 panel.innerHTML='<div class="account-status"><p>Signed in as <strong>'+esc(session.user.email||"reader")+'</strong></p><button id="signout" class="reader-btn" type="button">Sign out</button></div><section class="account-section"><div class="chapter-heading">Reading progress</div>'+progressHtml+'</section>'+(currentUserIsAdmin?'<section class="account-section"><div class="kicker">Author tools</div><h2>Publish a chapter</h2><p class="form-note">Save a chapter here and it will be available from the database without a website redeployment. Reuse a chapter slug to update that chapter.</p><form id="chapter-form" class="account-form"><label>Novel<select name="novel_id" required>'+allWorks.map(w=>'<option value="'+esc(w.id)+'">'+esc(w.title)+'</option>').join("")+'</select></label><div class="form-grid"><label>Chapter number<input name="chapter_number" type="number" min="1" required></label><label>Chapter slug<input name="slug" pattern="[a-z0-9-]+" placeholder="chapter-4" required></label></div><label>Chapter title<input name="title" required></label><label>Chapter text<textarea name="body" rows="14" required></textarea></label><label class="check-label"><input name="publish" type="checkbox" checked> Publish immediately</label><div class="form-actions"><button class="reader-btn" type="submit">Save chapter</button></div><p id="chapter-message" class="form-note" role="status"></p></form></section>':'<section class="account-section"><div class="chapter-heading">Author access</div><p class="form-note">This account can save reading progress. Author publishing tools appear after the account is granted author access in the Supabase database.</p></section>');
 document.getElementById("signout").addEventListener("click",async()=>{await supabaseClient.auth.signOut();currentSession=null;currentUserIsAdmin=false;await refreshFromDatabase(false);renderAccount();});
 const chapterForm=document.getElementById("chapter-form");
 if(chapterForm) chapterForm.addEventListener("submit",async event=>{
  event.preventDefault();
  const fd=new FormData(chapterForm);
  const novelId=String(fd.get("novel_id"));
  const slug=String(fd.get("slug")).trim();
  const number=Number(fd.get("chapter_number"));
  const published=fd.get("publish")==="on";
  const message=document.getElementById("chapter-message");
  message.textContent="Saving chapter…";
  const payload={id:novelId+"-"+slug,novel_id:novelId,slug,title:String(fd.get("title")).trim(),body:String(fd.get("body")),chapter_number:number,status:published?"Published":"Draft",is_published:published,published_at:published?new Date().toISOString():null,updated_at:new Date().toISOString()};
  const result=await supabaseClient.from("chapters").upsert(payload,{onConflict:"id"});
  if(result.error){message.textContent="Could not save chapter: "+result.error.message;return;}
  message.textContent=published?"Chapter saved and published.":"Chapter saved as a draft.";
  chapterForm.reset();
  chapterForm.elements.novel_id.value=novelId;
  chapterForm.elements.publish.checked=true;
  await refreshFromDatabase(false);
 });
}

function renderSettings(){
 document.title="Reading settings — Last Station";
 const themes=[["dark","Dark"],["light","Light"],["pale","Pale green"],["sepia","Sepia"],["midnight","Midnight blue"]];
 let html=crumb("Settings") + '<div class="kicker">Your reading experience</div><h1>Make it comfortable.</h1><p class="intro">Choose a page tone and typeface that make long chapters easier on your eyes. Your settings are saved on this device.</p><div class="settings-panel">';
 html+='<section class="settings-group"><h2>Page theme</h2><p class="settings-help">Change the background and text colors across the site.</p><div class="theme-options">';
 html+=themes.map(([id,label])=>'<button class="theme-choice" type="button" data-theme-choice="' + id + '" aria-pressed="' + (preferences.theme===id) + '">' + label + '</button>').join("");
 html+='</div></section><section class="settings-group"><h2>Reading font</h2><p class="settings-help">This changes the novel text, not the navigation or interface.</p><div class="settings-control"><label for="reading-font-choice">Typeface</label><select id="reading-font-choice">';
 html+=Object.entries(fontChoices).map(([id,f])=>'<option value="' + id + '" ' + (preferences.font===id?"selected":"") + '>' + f.label + '</option>').join("");
 html+='</select></div></section><section class="settings-group"><h2>Text size</h2><p class="settings-help">Adjust the reading text without zooming the entire page.</p><div class="settings-control"><label for="reading-size-choice">Font size: <span id="reading-size-value">' + preferences.fontSize + ' px</span></label><input id="reading-size-choice" type="range" min="14" max="24" step="1" value="' + preferences.fontSize + '"></div></section><section class="settings-group"><h2>Line spacing</h2><p class="settings-help">Give dense paragraphs more breathing room, or fit more text on screen.</p><div class="settings-control"><label for="reading-line-choice">Line spacing: <span id="reading-line-value">' + Number(preferences.lineHeight).toFixed(1) + '×</span></label><input id="reading-line-choice" type="range" min="1.5" max="2.4" step="0.1" value="' + preferences.lineHeight + '"></div></section><div class="settings-actions"><button id="save-settings" class="reader-btn" type="button">Save changes</button><button id="reset-settings" class="reader-btn" type="button">Reset defaults</button><button id="return-settings" class="reader-btn" type="button">Return to previous page</button></div><p id="settings-status" class="form-note" role="status" style="margin-top:14px">Changes preview immediately. Select Save changes to confirm and keep them on this device.</p><p class="form-note" style="margin-top:8px">Preferences are stored locally in this browser. They are not tied to your reader account yet.</p></div>';
 app.innerHTML=html;
 const status=document.getElementById("settings-status");
 function previewSettings(){applyPreferences();if(status)status.textContent="Preview updated. Select Save changes to confirm your choices."}
 document.querySelectorAll("[data-theme-choice]").forEach(button=>button.addEventListener("click",()=>{preferences.theme=button.dataset.themeChoice;previewSettings();document.querySelectorAll("[data-theme-choice]").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));}));
 document.getElementById("reading-font-choice").addEventListener("change",event=>{preferences.font=event.target.value;previewSettings()});
 document.getElementById("reading-size-choice").addEventListener("input",event=>{preferences.fontSize=Number(event.target.value);document.getElementById("reading-size-value").textContent=preferences.fontSize+" px";previewSettings()});
 document.getElementById("reading-line-choice").addEventListener("input",event=>{preferences.lineHeight=Number(event.target.value);document.getElementById("reading-line-value").textContent=preferences.lineHeight.toFixed(1)+"×";previewSettings()});
 document.getElementById("save-settings").addEventListener("click",()=>{applyPreferences();if(status)status.textContent="Saved. Your reading settings will be remembered in this browser."});
 document.getElementById("reset-settings").addEventListener("click",()=>{preferences={...preferenceDefaults};applyPreferences();renderSettings()});
 document.getElementById("return-settings").addEventListener("click",()=>{
  location.hash = '#' + settingsReturnRoute;
 });
}
function renderAbout(){
 document.title='About — Last Station';
 const aboutText='This is a home for the stories I am working on, the ones that are finished, and the ones that are not ready to leave the notebook yet.\n\nMore works are sure to come. I\'m at my last station and there\'s no train coming to pick me up anyways, so I\'ll just keep writing.\n\n-Demented Poet';
 const aboutParagraphs=aboutText.split(/\n\s*\n/).map(p=>'<p class="intro">'+esc(p)+'</p>').join('');
 app.innerHTML=crumb('About')+'<div class="kicker">A note from the author</div><h1>Still in transit.</h1>'+aboutParagraphs+'<p><a class="text-link" href="#/">← Back to the library</a></p>';
}
function render(){const parts=route().split('/').filter(Boolean);if(parts[0]==='novel'&&parts[1])renderNovel(parts[1]);else if(parts[0]==='read'&&parts[1])renderReader(parts[1],parts[2]);else if(parts[0]==='about')renderAbout();else if(parts[0]==='account')renderAccount();else if(parts[0]==='settings')renderSettings();else renderHome();applyPreferences();window.scrollTo(0,0)}
function handleHashChange(event){
 const nextRoute=route();
 let previousRoute='/';
 try{if(event.oldURL){const oldHash=event.oldURL.split('#')[1]||'/';previousRoute='/'+decodeURIComponent(oldHash).replace(/^\/+/, '');if(oldHash==='/'||oldHash==='')previousRoute='/';}}catch{}
 if(nextRoute==='/settings'&&previousRoute!=='/settings'){
  settingsReturnRoute=previousRoute;
  settingsReturnScroll=window.scrollY;
  try{sessionStorage.setItem('last-station-settings-return',JSON.stringify({route:settingsReturnRoute,scroll:settingsReturnScroll}));}catch{}
 }
 const returningFromSettings=previousRoute==='/settings'&&nextRoute===settingsReturnRoute;
 render();
 if(returningFromSettings)requestAnimationFrame(()=>window.scrollTo(0,settingsReturnScroll));
}
if(supabaseClient){supabaseClient.auth.onAuthStateChange((_event,session)=>{currentSession=session;setTimeout(async()=>{await refreshFromDatabase(false);if(route().startsWith("/account"))renderAccount();},0);});}
window.addEventListener('hashchange',handleHashChange);render();refreshFromDatabase();
})();
</script>
